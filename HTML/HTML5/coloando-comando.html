<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloando Código Fonte</title>

    <style>
        kbd{
            border: solid 1px black;
        }

    
    </style>
</head>
<body>
    <p>Para copiar esta informação, precione <kbd>CTRL</kbd> + <kbd>C</kbd></p>
    <hr>

    <p>Para troca o fundo de um elemento, utilize o comando <code>background-color</code></p>

    <p>Para troca o fundo utilze essa estrutua:</p>
    <pre>
        <code>
            code{
                background-color: #f1f1f1;
                color: red;
            }
        </code>
    </pre>

</body>
</html>
