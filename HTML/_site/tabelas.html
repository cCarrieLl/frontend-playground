    <style>
        table thead th{
            background-color: black;
            color: white;
        }     

        table tfoot td{
            background-color: lightgray;
        }

        table tbody tr:nth-child(even) td{
            background-color: #f1f1f1;;
        }
        table tbody tr:hover td{
            background-color: #E9E9E9;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <table summary="Tabelas de alunos da turma A" cellspacing="0" width="250" align="center" cellpadding="5">
        <tbory>
            <caption>Tabela de idade dos alunos DIO.me</caption>
            <thead>
                <tr>
                    <th colspan="2">Minha tabela</th>
                </tr>
                <tr>
                    <th title="Nome Completo">Nome</th>
                    <th>Idade</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Rafael</td>

                </tr>
                <tr>
                    <td>Manoela</td>

                </tr>
                <tr>
                    <td>Roberta</td>
                    <td>56</td>
                </tr>
                <tr>
                    <td>Lucas</td>
                    <td>25</td>
                </tr>
                <tr>
                    <td>Nina</td>
                    <td>36</td>
                </tr>
                <tr>
                    <td>Leonardo</td>
                    <td>28</td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <td>Total</td>
                    <td>6</td>
                </tr>
            </tfoot>
        </tbory>
    </table>
