<html>
    <head>
        <title>Fomulário</title>
    </head>

    <body>
        <h1>Formulario de Cadastro</h1>
        <hr>

        <form name="cadastro" automcomplete="on" target="_self" method="POST" action="#">
            Nome:<input type="text" name="name" /><br>
            Idade:<input type="number" name="idade" /><br>
            Senha:<input type="password" name="senha"/><br>
            <button type="submit">Enviar</button>
        </form>

        <br>
        <br>

        <hr>


        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome"><br>

            <label for="age">Idade:</label>
            <input type="number" step="2" min="12" max="99" id="age"><br>

            <label>Button:</label><input type="button" value="Enviar"/>
            <button type="button">Enviar</button><br>

            <label>Ranger:</label><input type="range" /><br>
            
            <label>Cor:</label><input type="color"/><br>

            <label>E-mail</label><input type="email" /><br>
            <label>Url</label><input type="url" />
            <button type="submit">Enviar</button><br>
            <label>CheckBox</label><input type="checkbox">
        </form>

        <br>

    </body>

</html>
